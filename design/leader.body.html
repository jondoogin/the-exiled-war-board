<div class="leadbar" id="leadbar">
  <div class="leadbar-in">
    <span class="leadbar-tag">Leadership</span>
    <span class="leadbar-msg" id="leadmsg">Tap any week to excuse it. Publishing updates the board everyone sees.</span>
    <button type="button" class="btn" id="publish" disabled>Nothing to publish</button>
  </div>
  <div class="leadbar-in leadbar-auth" id="leadauth" hidden>
    <label for="ghtoken" class="leadbar-tag">Access token</label>
    <input type="password" id="ghtoken" placeholder="paste token" autocomplete="off" spellcheck="false">
    <button type="button" class="btn" id="savetoken">Remember</button>
  </div>
</div>

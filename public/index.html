<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clan War Tracker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div>
    <h1 id="clan-name">Clan War Tracker</h1>
    <p class="sub" id="clan-sub">Loading…</p>
  </div>
  <div class="top-actions">
    <button id="sync" type="button">Sync from API</button>
    <a id="export" href="/api/export.csv">Export CSV</a>
  </div>
</header>

<p id="banner" class="banner" hidden></p>

<section class="tiles" id="tiles" aria-label="Clan summary"></section>

<section class="panel">
  <details id="knobs">
    <summary>Scoring model</summary>
    <div class="knob-grid">
      <label>Participation weight <output id="out-participation"></output>
        <input type="range" id="w-participation" min="0" max="1" step="0.05"></label>
      <label>Efficiency weight <output id="out-efficiency"></output>
        <input type="range" id="w-efficiency" min="0" max="1" step="0.05"></label>
      <label>Contribution weight <output id="out-contribution"></output>
        <input type="range" id="w-contribution" min="0" max="1" step="0.05"></label>
      <label>Recency half-life (wars) <output id="out-halflife"></output>
        <input type="range" id="halfLifeWars" min="1" max="10" step="1"></label>
      <label>Promote at <output id="out-promote"></output>
        <input type="range" id="t-promote" min="50" max="100" step="1"></label>
      <label>Hold above <output id="out-hold"></output>
        <input type="range" id="t-hold" min="30" max="95" step="1"></label>
      <label>Demote below <output id="out-warn"></output>
        <input type="range" id="t-warn" min="10" max="90" step="1"></label>
      <label class="check"><input type="checkbox" id="includeIncomplete"> Include the in-progress war week</label>
      <button type="button" id="reset-knobs">Reset to defaults</button>
    </div>
  </details>
</section>

<section class="panel controls">
  <input type="search" id="search" placeholder="Search member or tag" aria-label="Search members">
  <select id="filter-role" aria-label="Filter by role">
    <option value="">All roles</option>
    <option value="leader">Leader</option>
    <option value="coLeader">Co-leader</option>
    <option value="elder">Elder</option>
    <option value="member">Member</option>
  </select>
  <select id="filter-action" aria-label="Filter by recommendation">
    <option value="">All recommendations</option>
    <option value="promote">Promote</option>
    <option value="hold">Hold</option>
    <option value="watch">Watch</option>
    <option value="warn">Warn</option>
    <option value="demote">Demote</option>
    <option value="kick">Kick</option>
  </select>
  <label class="check"><input type="checkbox" id="show-departed"> Show departed</label>
  <span class="count" id="count"></span>
</section>

<div class="table-wrap">
  <table id="board">
    <thead>
      <tr>
        <th data-sort="rank" class="num">#</th>
        <th data-sort="name">Member</th>
        <th data-sort="score" class="num">Score</th>
        <th data-sort="trend" class="num">Trend</th>
        <th data-sort="deckRate" class="num">Decks used</th>
        <th data-sort="warsPlayed" class="num">Wars</th>
        <th data-sort="avgFame" class="num">Avg fame</th>
        <th data-sort="missStreak" class="num">Miss streak</th>
        <th data-sort="action">Recommendation</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<section class="panel">
  <h2>Roster activity</h2>
  <ul id="events" class="events"></ul>
</section>

<script type="module" src="/app.js"></script>
</body>
</html>

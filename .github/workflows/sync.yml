name: Sync and publish

# Pulls the clan from the Clash API, commits the updated store, rebuilds the
# board and deploys it. Runs itself daily so nobody has to remember to.
#
# Setup, once:
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#        CR_API_TOKEN   your developer.clashroyale.com key
#   2. Same screen, Variables tab (optional, defaults to The Exiled):
#        CR_CLAN_TAG    #P2VPUYUU
#   3. Settings -> Pages -> Source: GitHub Actions
#
# The key must whitelist 45.79.218.79 (the RoyaleAPI proxy), NOT a home IP —
# GitHub runners get a different address every run.

on:
  schedule:
    # 10:30 UTC, shortly after Clash's daily reset (~10:00 UTC), so the day
    # that just closed is final before it is recorded.
    - cron: '30 10 * * *'
  # An excuse published from the leadership page commits data/excuses.json;
  # rebuild straight away so the shared board reflects it within a minute.
  push:
    branches: [main]
    paths:
      - 'data/excuses.json'
      - 'design/**'
      - 'scripts/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two syncs race for the same commit.
concurrency:
  group: war-board-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull from the Clash API
        # Skipped on push runs: those are code or excuse changes, and the
        # synced record has not moved.
        if: github.event_name != 'push'
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          CR_CLAN_TAG: ${{ vars.CR_CLAN_TAG || '#P2VPUYUU' }}
          CR_API_BASE: https://proxy.royaleapi.dev/v1
        run: npm run sync

      - name: Build the board
        env:
          # Repository variable (Settings -> Variables), not a secret — it is a
          # public URL. Empty until the write endpoint is deployed, in which
          # case the leadership page says so instead of failing silently.
          WAR_BOARD_API: ${{ vars.WAR_BOARD_API }}
        run: node scripts/build-ledger.mjs

      - name: Commit this week's history
        if: github.event_name != 'push'
        run: |
          git config user.name 'war-board'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          # Nothing changed on a quiet day; that is not a failure.
          if git diff --staged --quiet; then
            echo 'No roster or war changes since the last sync.'
          else
            git commit -m "Sync $(date -u '+%Y-%m-%d')"
            # A leader publishing an excuse commits to main from the Vercel
            # function, and can land between this run's checkout and its push.
            # Rebase onto whatever arrived rather than failing the sync — the
            # two touch different files, so there is nothing to resolve.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (attempt $attempt) — rebasing onto main and retrying."
              git pull --rebase origin main
            done
            echo 'Could not push after three attempts.' >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
